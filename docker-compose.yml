services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-template}
      POSTGRES_DB: ${POSTGRES_DB:-template}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-template}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-template}:${POSTGRES_PASSWORD:-template}@db:5432/${POSTGRES_DB:-template}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3030}
      DEBUG: ${DEBUG:-true}
    ports:
      - "3031:3031"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Server-side only: the browser never sees this host.
      API_URL: http://backend:3031
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3030}
    ports:
      - "3030:3030"
    depends_on:
      - backend

  # ----- Test runners -----
  # Behind the `test` profile, so `docker compose up` ignores them. They mount
  # the working tree instead of baking it in, which is what lets a run pick up
  # edits without rebuilding the image.
  #
  #   docker compose run --rm frontend-test
  #   docker compose run --rm backend-test
  #
  # `user` keeps files the run writes (.next, __pycache__) owned by the caller
  # rather than root.

  frontend-test:
    build:
      context: ./frontend
      # The deps stage carries the dev dependencies: jest, ts-node, eslint.
      target: deps
    profiles: ["test"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keeps the image's node_modules from being shadowed by
      # the mount above, which on the host is empty.
      - /app/node_modules
    command: npx jest

  backend-test:
    build: ./backend
    profiles: ["test"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # The tests bind to a throwaway SQLite file, so no db service is needed.
    volumes:
      - ./backend:/app
    command: pytest -q

volumes:
  postgres_data:
